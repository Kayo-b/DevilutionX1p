# Diablo First-Person: builds the Windows zip (Packaging/fp/package-windows.sh) and, for a version tag (v1, v1.1, ...),
# publishes it as that version's GitHub release. Run it by hand from the Actions tab for a test build (the zip is then
# the run's artifact).
name: First-Person Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install the build tools
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gettext zip

    - name: Cache the cross-compiler and SDL2
      uses: actions/cache@v6
      with:
        path: ~/.cache/devilutionx-fp
        key: fp-windows-toolchain-${{ hashFiles('Packaging/fp/package-windows.sh') }}

    - name: Build and pack
      env:
        FP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      run: Packaging/fp/package-windows.sh

    - name: Upload the zip
      uses: actions/upload-artifact@v7
      with:
        name: DevilutionX-FP-windows-x64
        path: build-windows/release/*.zip

    - name: Publish the release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" build-windows/release/*.zip --clobber
        else
          gh release create "$TAG" build-windows/release/*.zip --title "Diablo First-Person $TAG" --notes-file Packaging/fp/release-notes.md
        fi
